<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Analyzer</title>

<!--
  Sin @babel/standalone. El JSX se precompila a app.js con un comando
  (`npm run build` → babel web/app.jsx). Cargar el compilador en el navegador
  cuesta 2.914 KB que no dibujan nada: más que Plotly entero.
-->
<!-- Servidos desde acá y no desde un CDN a propósito. Un script de terceros
     corre con acceso total a esta página: lee el localStorage —donde vive el
     sobre de sesión de Cocos— y ve lo que se tipea en el formulario del broker.
     Un CDN comprometido serviría las sesiones de todos los usuarios. Versiones
     fijas: React 18.3.1, Plotly 2.27.0. Para actualizar, bajar el archivo nuevo
     a web/vendor/ y cambiar el nombre acá. -->
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/plotly.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/*
  Tema por tokens, con los TRES estados que tiene un usuario:
    · eligió claro       → [data-theme="light"]
    · eligió oscuro      → [data-theme="dark"]
    · no eligió (inicial)→ nada marcado, manda prefers-color-scheme

  Ningún componente escribe un color literal: todos salen de estas variables,
  Plotly incluido. Es la única forma de que agregar un gráfico nuevo no rompa
  uno de los dos temas.
*/
/*
  El claro no es "el oscuro con los valores dados vuelta": es una paleta propia,
  de lino y salvia. Lo que la gobierna, en orden de importancia:

    1. **Nada de blanco puro, y el panel lejos del techo.** Está en 91,4 % de
       luminancia: se lee como papel, no como una lámpara. Es el número que
       decide si la pantalla cansa a las dos horas, porque el panel es lo que
       más superficie ocupa.
    2. **Panel y fondo tienen que separarse solos**, sin depender del borde:
       1,154 de contraste entre ellos, y el borde en 1,466. Por debajo de ~1,10
       la pantalla vuelve a ser una sola superficie con líneas encima, que es
       como estaba antes y no se lee.
    3. **Una sola familia de matices.** Todos los neutros son cálidos —el mismo
       sesgo de la salvia del acento— en vez de tirar a azul mientras el acento
       tira a verde. Eso, y no el contraste, es lo que hacía que se leyera
       clínica.
    4. **Contraste suficiente, no máximo — para el texto.** El texto principal
       está en 11,7:1 sobre panel. AA pide 4,5 y AAA 7: sobra de largo, y el
       negro casi puro que había antes (15,8:1) vibra sobre una superficie clara
       sin comprar nada a cambio.
    5. **Los colores que significan algo van saturados y tan brillantes como el
       contraste permita.** Es lo contrario de la regla anterior y no se
       contradice: al texto lo lee todo el mundo, pero un número en verde o en
       rojo tiene que SALTAR. Sobre una superficie cálida un verde o un rojo
       apagados se leen como parte del fondo —un primer intento con el positivo
       en 40 % de saturación y el negativo en 48 % dejó la pantalla entera
       terracota—. Verde y rojo van al **máximo brillo que todavía pasa AA sobre
       panel**: 4,52 y 4,53 contra los 6,0 y 6,7 que tenían, con el matiz lejos
       del 42° del lino. Ese 4,5 es el techo del brillo, no un piso de
       accesibilidad que sobre: subirlos un punto más los saca de AA.
    6. **La yema es superficie, nunca tinta.** Un amarillo de verdad no llega ni
       a 1,6:1 contra un panel claro: como texto o como línea fina no se ve, y
       oscurecerlo hasta que se lea lo convierte en el mismo ocre del fondo. Va
       de relleno —el aviso que hay que mirar, la barra de simulación, el punto
       de "corriendo"— con el texto oscuro encima, que ahí sí da 8,09:1. Para
       cuando hace falta ámbar de tinta está `--alerta`, que es su versión
       legible.

  Todo texto pasa AA (4,5:1) sobre panel, series de gráficos incluidas: las lee
  `colores()` en app.jsx y se las pasa a Plotly, así que un gráfico nuevo nace
  con la paleta puesta.
*/
:root {
  --fondo:      #E9E5DC;
  --panel:      #F7F5F0;
  --panel-2:    #EFEBE2;
  --borde:      #D3CCBE;
  --borde-suave:#E3DED2;
  --texto:      #35322D;
  --texto-2:    #55514A;
  --texto-3:    #746F65;
  --acento:     #0A6B42;
  --acento-2:   #0E7C4E;
  --acento-suave:#D9EBE0;
  --positivo:   #08814F;
  --negativo:   #D72B1F;
  --alerta:     #9C6404;
  --destaque:   #F5C93F;
  --destaque-suave:#FBEEC4;
  --sombra:     0 1px 2px rgba(58,55,48,.05), 0 10px 24px -14px rgba(58,55,48,.22);
  --serie-1:#08804E; --serie-2:#AF5807; --serie-3:#2670C6; --serie-4:#D42364;
  --serie-5:#8357CE; --serie-6:#0B7C85; --serie-7:#79720A; --serie-8:#597386;
  --marca-actual:#B88308; --marca-optima:#08A169;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo:#0E1418; --panel:#161F25; --panel-2:#1E2A31; --borde:#2A3841;
    --borde-suave:#212D35; --texto:#E6EDF2; --texto-2:#A6B4BF; --texto-3:#78868F;
    --acento:#4FC3A8; --acento-2:#6FD9BE; --acento-suave:#10302A;
    --positivo:#5FBF8B; --negativo:#E0765C; --alerta:#DDA95E;
    --destaque:#F2C94C; --destaque-suave:#3B3216;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -14px rgba(0,0,0,.7);
    --serie-1:#4FC3A8; --serie-2:#DFA45E; --serie-3:#78A6DD; --serie-4:#E08098;
    --serie-5:#AE9BD8; --serie-6:#5FC3C3; --serie-7:#C6B36A; --serie-8:#93A5B3;
    --marca-actual:#DCE633; --marca-optima:#00E6A0;
  }
}
[data-theme="dark"] {
  --fondo:#0E1418; --panel:#161F25; --panel-2:#1E2A31; --borde:#2A3841;
  --borde-suave:#212D35; --texto:#E6EDF2; --texto-2:#A6B4BF; --texto-3:#78868F;
  --acento:#4FC3A8; --acento-2:#6FD9BE; --acento-suave:#10302A;
  --positivo:#5FBF8B; --negativo:#E0765C; --alerta:#DDA95E;
  --destaque:#F2C94C; --destaque-suave:#3B3216;
  --sombra:0 1px 2px rgba(0,0,0,.45), 0 8px 22px -14px rgba(0,0,0,.7);
  --serie-1:#4FC3A8; --serie-2:#DFA45E; --serie-3:#78A6DD; --serie-4:#E08098;
  --serie-5:#AE9BD8; --serie-6:#5FC3C3; --serie-7:#C6B36A; --serie-8:#93A5B3;
  --marca-actual:#DCE633; --marca-optima:#00E6A0;
}

*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);
     font:15px/1.55 "Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ── Barra superior ── */
.barra{position:sticky;top:0;z-index:50;background:var(--panel);
       border-bottom:1px solid var(--borde);display:flex;align-items:center;
       gap:18px;padding:0 20px;height:56px;flex-wrap:wrap}
.marca{font-weight:700;letter-spacing:-.02em;font-size:16px;white-space:nowrap}
.marca span{color:var(--acento)}
.modos{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:8px}
.modo{border:0;background:transparent;color:var(--texto-2);font:inherit;font-size:13.5px;
      font-weight:500;padding:6px 14px;border-radius:6px;cursor:pointer}
.modo.on{background:var(--panel);color:var(--texto);box-shadow:var(--sombra)}
.barra .der{margin-left:auto;display:flex;align-items:center;gap:10px}
/* La plaza desde la que se mide: se muestra, no se elige — se fija en Carteras. */
.plaza{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--texto-2);
       border:1px solid var(--borde);border-radius:7px;padding:5px 10px;white-space:nowrap}
.chip-plaza{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;
            background:var(--panel);color:var(--texto-2);border:1px solid var(--borde);
            border-radius:100px;padding:5px 12px}
.chip-plaza:hover{border-color:var(--acento)}
.chip-plaza.on{background:var(--acento);color:var(--fondo);border-color:var(--acento);font-weight:600}

select,input,button{font:inherit}
select,input[type=text],input[type=number],input[type=email],input[type=password]{background:var(--panel);color:var(--texto);
  border:1px solid var(--borde);border-radius:7px;padding:6px 10px;font-size:13.5px}
.btn{background:var(--panel);color:var(--texto);border:1px solid var(--borde);
     border-radius:7px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--acento)}
.btn.primario{background:var(--acento);color:var(--fondo);border-color:var(--acento);font-weight:600}
.btn.peligro{color:var(--negativo);border-color:var(--negativo)}
/* Los colores de Yahoo Finance: el botón se reconoce antes de leerlo. */
.btn.yahoo{background:#6001D2;color:#fff;border-color:#6001D2;font-weight:600}
.btn.yahoo:hover{background:#7E1FFF;border-color:#7E1FFF}
.btn.yahoo b{font-weight:800;letter-spacing:-.02em}
.btn:disabled{opacity:.5;cursor:default}
.tema{width:36px;height:32px;display:grid;place-items:center;padding:0}

/* ── Estructura ── */
.hoja{max-width:1400px;margin:0 auto;padding:20px}
.fila{display:grid;gap:14px;margin-bottom:14px}
.f2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.f3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
       padding:16px 18px;box-shadow:var(--sombra)}
.panel h3{margin:0 0 3px;font-size:14px;font-weight:600;letter-spacing:-.01em;
          display:flex;align-items:center;gap:7px}
.pie{font-size:12.5px;color:var(--texto-3);margin-top:9px;line-height:1.45}
.pie a{color:var(--acento)}

/* ── KPI con explicación ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
     padding:12px 14px;position:relative;box-shadow:var(--sombra)}
.kpi .et{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--texto-3);
         font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .val{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.kpi .sub{font-size:12px;color:var(--texto-3);margin-top:1px}
.kpi.pos .val{color:var(--positivo)} .kpi.neg .val{color:var(--negativo)}

/* El popup se abre al pasar el mouse Y al hacer clic: en tablet no hay hover,
   y esta herramienta se usa en tablet. */
.ayuda{width:14px;height:14px;border-radius:50%;border:1px solid var(--texto-3);
       color:var(--texto-3);font-size:9px;display:grid;place-items:center;cursor:help;
       background:transparent;padding:0;flex:0 0 auto}
.globo{position:absolute;z-index:60;top:calc(100% + 6px);left:0;width:min(300px,80vw);
       background:var(--panel);border:1px solid var(--borde);border-radius:9px;
       padding:11px 13px;box-shadow:0 10px 30px -8px rgba(0,0,0,.35);
       font-size:12.5px;line-height:1.5;color:var(--texto-2);text-transform:none;
       letter-spacing:0;font-weight:400}
.globo b{color:var(--texto);display:block;margin-bottom:3px;font-size:12.5px}
.globo .umbral{margin-top:6px;color:var(--texto-3);font-size:11.5px}

/* ── Tablas ── */
.tabla-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
   color:var(--texto-3);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--borde);
   white-space:nowrap;background:var(--panel-2)}
td{padding:7px 10px;border-bottom:1px solid var(--borde-suave)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--positivo)} .neg{color:var(--negativo)}
/* El resultado por tipo de cambio se lee de un vistazo: no alcanza el signo. */
td.fx.pos{background:color-mix(in srgb,var(--positivo) 15%,transparent)}
td.fx.neg{background:color-mix(in srgb,var(--negativo) 15%,transparent)}
td.fx{font-weight:600}

/* ── Pestañas ── */
/* Fija bajo la barra superior: en Posición la tabla de tenencias es larga y
   había que volver arriba del todo para cambiar de sección o de índice. */
.tabs{position:sticky;top:56px;z-index:40;background:var(--fondo);
      display:flex;gap:3px;flex-wrap:wrap;align-items:center;
      margin:0 -20px 14px;padding:10px 20px 0;
      border-bottom:1px solid var(--borde)}
.tab{border:0;background:transparent;color:var(--texto-2);font:inherit;font-size:13.5px;
     padding:9px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
.tab .pin{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px}
.pin.listo{background:var(--positivo)} .pin.corriendo{background:var(--destaque)}
.pin.error{background:var(--negativo)}

/* ── Avisos ── */
.aviso{border-left:3px solid var(--borde);background:var(--panel);padding:11px 14px;
       border-radius:0 8px 8px 0;font-size:13px;color:var(--texto-2);margin:10px 0}
.aviso.ok{border-left-color:var(--positivo);background:var(--acento-suave);color:var(--texto)}
.aviso.mal{border-left-color:var(--negativo)}
/* Lo que hay que mirar antes de seguir va sobre yema: el ámbar del borde solo
   no alcanzaba para separarlo de un aviso cualquiera. */
.aviso.ojo{border-left-color:var(--destaque);background:var(--destaque-suave);color:var(--texto)}
.aviso b{color:var(--texto)}
.vacio{padding:44px 20px;text-align:center;color:var(--texto-3);font-size:14px}
.cargando{padding:26px;text-align:center;color:var(--texto-3);font-size:13px}

/* Ancho fijo y texto centrado: los veredictos son una escala —COMPRAR/MANTENER/
   VENDER, FAVORABLE/NEUTRAL/EVITAR— y con el ancho siguiendo al largo de la
   palabra la columna se leía como un borde dentado en vez de como una escala. */
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:104px;
      font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;text-align:center;
      font-weight:600;padding:3px 10px;border-radius:100px;border:1px solid currentColor}
.chip.ok{color:var(--positivo)} .chip.mal{color:var(--negativo)} .chip.ojo{color:var(--alerta)}
/* Toda celda cuyo contenido es un chip se centra sola: son 14 tablas y no hay
   motivo para recordar la clase en cada una. Cuando además del chip hay texto
   —el ticker con su "bono", el índice con su "correcto"— la celda es del texto y
   se alinea como las de al lado: centrarla la desplazaba y parecía tabulada.
   CSS no distingue un nodo de texto suelto, así que eso lo dice la clase. */
td:has(> .chip){text-align:center}
td.textochip{text-align:left}
th.c{text-align:center}

footer{max-width:1400px;margin:26px auto 0;padding:18px 20px 40px;border-top:1px solid var(--borde);
       color:var(--texto-3);font-size:12.5px;display:flex;justify-content:space-between;
       gap:12px;flex-wrap:wrap}
footer a{color:var(--acento);text-decoration:none}
footer .kofi{opacity:.75;transition:opacity .15s;line-height:0;flex:none}
footer .kofi:hover{opacity:1}
footer .kofi img{height:28px;display:block;border:0;border-radius:5px}
footer a:hover{text-decoration:underline}
/* ── Componentes traídos de la librería UX-UI ───────────────────────────────
   Estuvieron detrás de ?lab=1 hasta que se aprobaron; el prefijo `lab-` quedó
   como marca de origen. Bloque autocontenido: se puede leer y podar de una. */
.lab-zona{display:grid;grid-template-columns:132px 1fr 156px;gap:16px;align-items:center;
          padding:16px 0;border-bottom:1px solid var(--borde-suave)}
.lab-zona:last-of-type{border-bottom:0}
.lab-zona .et{font-weight:600;font-size:14px}
.lab-zona .et s{display:block;text-decoration:none;font-weight:400;font-size:12px;
                color:var(--texto-3);margin-top:3px}
.lab-barra{position:relative;padding-top:20px}
.lab-barra .via{height:13px;border-radius:7px;position:relative}
.lab-barra .via::after{content:"";position:absolute;inset:0;border-radius:7px;
  background:var(--panel);left:var(--pct);opacity:.84;transition:left .35s}
.lab-barra .tope{position:absolute;top:-5px;bottom:-5px;left:var(--lim);width:2px;
  background:var(--texto);border-radius:2px}
.lab-barra .tope s{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  text-decoration:none;font-size:10.5px;color:var(--texto-2);white-space:nowrap;padding-bottom:4px}
.lab-barra .aguja{position:absolute;top:15px;left:var(--pct);margin-left:-6px;width:0;height:0;
  border:6px solid transparent;border-top-color:var(--texto);transition:left .35s}
.lab-barra .pies{position:relative;height:15px;margin-top:9px;
  font-size:10.5px;color:var(--texto-3)}
.lab-barra .pies span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.lab-barra .pies span:last-child{transform:translateX(-100%)}
.lab-zona .val{text-align:right}
.lab-zona .val b{font-size:19px;font-variant-numeric:tabular-nums}
.lab-zona .val s{display:block;text-decoration:none;font-size:11.5px;color:var(--texto-3);margin-top:4px}

.lab-tree{display:flex;flex-direction:column;gap:4px;height:300px}
.lab-tree .sec{display:grid;grid-template-columns:152px 1fr;gap:10px;align-items:center;
               min-height:30px}
.lab-tree .rot{display:flex;align-items:baseline;gap:6px;font-size:10.5px;line-height:1.3;
               color:var(--texto-3);overflow:hidden}
.lab-tree .rot u{width:8px;height:8px;border-radius:2px;text-decoration:none;flex:none;
                 position:relative;top:1px}
/* Una línea con puntos suspensivos, no dos recortadas: el nombre de la
   industria cortado a la mitad de la segunda línea ("Software - Infrastructur")
   se lee peor que uno abreviado en limpio, y el nombre entero está en el título
   de la fila. `min-width:0` es lo que deja encogerse al nombre dentro del flex;
   sin eso empuja al porcentaje fuera de la columna en vez de abreviarse. */
.lab-tree .rot b{color:var(--texto-2);font-weight:600;white-space:nowrap;overflow:hidden;
                 text-overflow:ellipsis;min-width:0}
.lab-tree .rot i{font-style:normal;white-space:nowrap;flex:none;margin-left:auto}
.lab-tree .cajas{display:flex;gap:3px;height:100%;min-height:0}
.lab-tree i{border-radius:4px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:2px;font-style:normal;font-size:11.5px;font-weight:600;text-align:center;
  padding:2px;overflow:hidden;cursor:default;color:var(--fondo);
  transition:filter .2s;min-width:0}
.lab-tree i:hover{filter:brightness(1.12)}
.lab-tree i s{text-decoration:none;font-weight:400;font-size:10.5px;opacity:.8}
.lab-tree i.chico{font-size:10px}.lab-tree i.chico s{font-size:9px}
.lab-tree .cajas.bajo i{flex-direction:row;gap:6px;font-size:10.5px}
.lab-tree .cajas.bajo i s{font-size:10px}
.lab-front{width:100%;height:auto;display:block;overflow:visible;margin-top:4px}
.lab-fhd{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;font-size:11px;
         color:var(--texto-3);margin-top:6px}
.lab-fhd span:first-child{flex:1;text-transform:uppercase;letter-spacing:.1em}
.lab-fhd b{color:var(--texto-2);font-weight:600}
.lab-front .malla line{stroke:var(--borde-suave);stroke-width:1}
.lab-front .cero{stroke:var(--borde);stroke-width:1.4}
.lab-front .eficiente{fill:none;stroke:var(--acento);stroke-width:2.4;stroke-linecap:round;
  stroke-linejoin:round}
.lab-front .ineficiente{fill:none;stroke:var(--texto-3);stroke-width:1.6;stroke-dasharray:3 3;
  opacity:.7}
.lab-front .cal{fill:none;stroke:var(--alerta);stroke-width:1.5;stroke-dasharray:5 4;opacity:.85}
.lab-front .nube{fill:none;stroke:var(--texto-3);stroke-width:1.4;stroke-linecap:round;
  opacity:.26;pointer-events:none}
.lab-front .activo circle:first-child{fill:var(--panel);stroke:var(--texto-3);stroke-width:1.6}
.lab-front .activo text{font-size:9.5px;fill:var(--texto-3);pointer-events:none}
.lab-front .activo:hover circle:first-child,
.lab-front .activo:focus-visible circle:first-child{stroke:var(--texto);r:6}
.lab-front .marca circle:first-child{stroke:var(--panel);stroke-width:2;transition:r .15s}
.lab-front .marca:hover circle:first-child,
.lab-front .marca:focus-visible circle:first-child{r:8.5}
.lab-front .marca.tan circle:first-child{filter:drop-shadow(0 0 6px var(--marca-optima))}
.lab-front .hit{fill:transparent;cursor:crosshair}
.lab-front .activo:focus,.lab-front .marca:focus{outline:none}
.lab-front .tip{opacity:0;transition:opacity .16s;pointer-events:none}
.lab-front .activo:hover .tip,.lab-front .activo:focus-visible .tip,
.lab-front .marca:hover .tip,.lab-front .marca:focus-visible .tip{opacity:1}
.lab-front .tip rect{fill:var(--panel);stroke:var(--borde);stroke-width:1}
.lab-front .tip .t1{font-size:10px;font-weight:600;fill:var(--texto)}
.lab-front .tip .t2{font-size:9.5px;fill:var(--texto-3)}
.lab-front .cruz{pointer-events:none}
.lab-front .cruz line{stroke:var(--texto-3);stroke-width:1;stroke-dasharray:3 3}
.lab-front .cruz .et rect{fill:var(--panel);stroke:var(--borde);stroke-width:1}
.lab-front .cruz .et text{font-size:9px;font-weight:600;fill:var(--texto)}
.lab-front .cruz .zona{font-size:8.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase}
.lab-front .cruz .zona.no{fill:var(--alerta)}
.lab-front .cruz .zona.tibio{fill:var(--texto-2)}
.lab-front .cruz .zona.ok{fill:var(--acento)}
.lab-front .ejes text{font-size:10px;fill:var(--texto-3)}
.lab-front .ejes .ttl{font-size:8.5px;letter-spacing:.2em;fill:var(--texto-3)}
.lab-flg{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px;font-size:11px;color:var(--texto-3)}
.lab-flg span{display:flex;align-items:center;gap:6px}
.lab-flg u{width:12px;height:3px;text-decoration:none;flex:none}
.lab-flg u.ueff{background:var(--acento);height:3px;border-radius:2px}
.lab-flg u.uine{background:repeating-linear-gradient(90deg,var(--texto-3) 0 3px,transparent 3px 6px)}
.lab-flg u.ucal{background:repeating-linear-gradient(90deg,var(--alerta) 0 4px,transparent 4px 7px)}
.lab-flg u.uact{width:9px;height:9px;border-radius:50%;background:var(--panel);
                box-shadow:inset 0 0 0 1.6px var(--texto-3)}
.lab-flg u.unube{width:9px;height:9px;border-radius:50%;background:var(--texto-3);opacity:.4}

/* Mismo recurso que td.fx: el fondo va en la celda. Con un ::after desbordado
   la tabla se llevaba 4 px de más y aparecía la barra horizontal. */
.lab-gana{color:var(--positivo);font-weight:700;
  background:color-mix(in srgb,var(--positivo) 13%,transparent)}

/* TGL-02 · día / noche. La luna se va y entra el sol; las estrellas titilan
   solo de noche. El switch marca el tema que se está viendo, no el que falta. */
.lab-dianoche{display:inline-flex;cursor:pointer;user-select:none}
.lab-dianoche input{position:absolute;opacity:0;width:0;height:0}
.lab-dianoche .g{width:60px;height:29px;border-radius:15px;position:relative;overflow:hidden;
  transition:background .5s,border-color .5s;border:1px solid #2b3a4a;
  background:linear-gradient(180deg,#161f2e,#0e1620)}
.lab-dianoche .g::after{content:"☾";position:absolute;top:2px;left:2px;width:23px;height:23px;
  border-radius:50%;background:#334252;color:#c9d4de;display:grid;place-content:center;
  font-size:12.5px;transition:.45s cubic-bezier(.6,-.3,.3,1.4)}
.lab-dianoche .estrellas{position:absolute;inset:0;transition:opacity .4s;background:
  radial-gradient(1px 1px at 22% 32%,#fff,transparent),
  radial-gradient(1px 1px at 47% 68%,#ffffff99,transparent),
  radial-gradient(1px 1px at 31% 58%,#ffffff66,transparent),
  radial-gradient(1px 1px at 62% 26%,#ffffff88,transparent)}
.lab-dianoche input:checked + .g{border-color:#8fc6da;
  background:linear-gradient(180deg,#7fc4e0,#c7e6f2)}
.lab-dianoche input:checked + .g::after{content:"☀";left:33px;background:#fde9b8;color:#8a6410;
  box-shadow:0 0 14px #f6cd6e}
.lab-dianoche input:checked + .g .estrellas{opacity:0}
.lab-dianoche input:focus-visible + .g{outline:2px solid var(--acento);outline-offset:2px}
@keyframes lab-titila{50%{opacity:.35}}
.lab-dianoche input:not(:checked) + .g .estrellas{animation:lab-titila 3s ease-in-out infinite}
.btn.auto{padding:5px 9px;font-size:11.5px;color:var(--texto-3)}

/* BTN-02 · el trazo recorre el perímetro hasta que se completa al pasar el mouse. */
.lab-trazo{position:relative;padding:9px 22px;border:0;border-radius:7px;cursor:pointer;
  background:var(--acento-suave);color:var(--acento);font-size:13.5px;font-weight:600}
.lab-trazo svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lab-trazo rect{fill:none;stroke:var(--acento);stroke-width:2;stroke-dasharray:8 92;
  animation:lab-trace 3.4s linear infinite;opacity:.9}
.lab-trazo:hover:not(:disabled) rect{stroke-dasharray:100 0;animation:none;
  filter:drop-shadow(0 0 6px var(--acento))}
.lab-trazo:disabled{opacity:.5;cursor:default}
.lab-trazo:disabled rect{animation:none;stroke-dasharray:100 0;opacity:.35}
@keyframes lab-trace{to{stroke-dashoffset:-100}}

/* BTN-01 · neón con brillo que barre. Abre la simulación: es la única acción de
   la pantalla que propone algo que todavía no existe, y se distingue del resto
   sin gritar. Del picker se conserva la forma —degradé, halo y barrido—; los
   colores salen de la paleta de la app, igual que se hizo con BTN-02. */
.lab-neon{padding:7px 18px;border:0;border-radius:6px;cursor:pointer;font:inherit;
  font-size:13.5px;font-weight:600;color:var(--fondo);position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--acento-2),var(--acento));
  box-shadow:0 0 0 1px var(--acento),0 6px 18px -6px var(--acento);transition:.25s}
.lab-neon:hover{transform:translateY(-2px);
  box-shadow:0 0 0 1px var(--acento-2),0 10px 26px -6px var(--acento)}
.lab-neon:active{transform:translateY(0)}
.lab-neon::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(90deg,transparent,#ffffff9c,transparent);
  animation:lab-brillo 3s ease-in-out infinite}
@keyframes lab-brillo{0%,60%{left:-60%}100%{left:120%}}

/* BTN-05 · relleno que barre al pasar por encima. Las dos puertas del CSV,
   importar y exportar, que son la misma operación en dos sentidos y ahora se
   ven como tal. El z-index:0 del botón es lo que mantiene al relleno adentro. */
.lab-barrido{position:relative;z-index:0;overflow:hidden;cursor:pointer;font:inherit;
  font-size:13.5px;padding:6px 16px;border-radius:2px;text-decoration:none;
  background:transparent;color:var(--acento);border:1px solid var(--acento);
  transition:color .3s}
.lab-barrido::before{content:"";position:absolute;inset:0;background:var(--acento);
  transform:skewX(-20deg) translateX(-120%);z-index:-1;
  transition:transform .35s cubic-bezier(.4,0,.2,1)}
.lab-barrido:hover{color:var(--fondo)}
.lab-barrido:hover::before{transform:skewX(-20deg) translateX(-10%)}

.lab-radarfila{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:22px;
               align-items:center}
@media (max-width:820px){.lab-radarfila{grid-template-columns:1fr}}

.lab-radar{width:100%;max-width:430px;height:auto;display:block;margin:6px auto 0;overflow:visible}
.lab-radar .malla polygon,.lab-radar .malla line{fill:none;stroke:var(--borde);stroke-width:1}
.lab-radar .forma{fill-opacity:.10;stroke-width:2;stroke-linejoin:round}
.lab-radar .eje{font-size:9.5px;fill:var(--texto-3)}
.lab-radar-lg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11.5px;
              color:var(--texto-3)}
.lab-radar-lg span{display:flex;align-items:center;gap:6px}
.lab-radar-lg u{width:9px;height:9px;border-radius:2px;text-decoration:none}

.lab-tirgrande{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.lab-tirgrande b{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.lab-tirgrande span{color:var(--texto-3);font-size:13px}
.lab-tirserie{width:100%;height:90px;display:block;margin-top:14px}
.lab-tirserie path{fill:none;stroke-width:1.8;stroke-linejoin:round;
                   vector-effect:non-scaling-stroke}
.lab-tirserie line{stroke:var(--borde);stroke-width:1;stroke-dasharray:3 3;
                   vector-effect:non-scaling-stroke}
.lab-tirejes{display:flex;justify-content:space-between;gap:12px;margin-top:6px;
             font-size:11px;color:var(--texto-3)}

.lab-tir{margin-top:11px;padding-top:11px;border-top:1px solid var(--borde-suave);
         display:flex;flex-direction:column;gap:7px}
.lab-tir div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px}
.lab-tir s{text-decoration:none;color:var(--texto-3)}
.lab-tir b{font-variant-numeric:tabular-nums}
.lab-tir .foco b{font-size:17px}
.lab-tir .detalle{display:block;font-size:11.5px;color:var(--texto-3);margin-top:-2px}
.lab-tir .tenue{opacity:.72}
.lab-tir .tenue b{font-size:13.5px}

.lab-valor{position:relative;overflow:hidden;justify-content:flex-start}
.lab-valor .cifra{font-size:31px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
/* El área crece con la tarjeta: al lado de una más alta quedaba un hueco. */
.lab-valor svg{position:absolute;left:0;right:0;bottom:17px;top:104px;width:100%;height:auto;
               min-height:74px}
.lab-valor .lab-ejeT{position:absolute;left:0;right:0;bottom:0;height:15px}

/* Rótulos de tiempo: van fuera del SVG, que se estira y deformaría el texto. */
.lab-ejeT{position:relative;font-size:10px;color:var(--texto-3)}
.lab-ejeT span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.lab-ejeT span:first-child{transform:none}
.lab-ejeT span:last-child{transform:translateX(-100%)}
.ejeT line{stroke:var(--borde-suave);stroke-width:1;vector-effect:non-scaling-stroke}
.lab-valor .cap{fill:none;stroke:var(--texto-3);stroke-width:1.2;stroke-dasharray:4 3;
                opacity:.75;vector-effect:non-scaling-stroke}

.lab-bullet{display:grid;grid-template-columns:88px 1fr 62px 136px;gap:14px;align-items:center;
            padding:9px 0}
.lab-bullet + .lab-bullet{border-top:1px solid var(--borde-suave)}
.lab-bullet .via{position:relative;height:18px;border-radius:4px;background:var(--panel-2)}
.lab-bullet .hoy{position:absolute;top:4.5px;height:9px;border-radius:3px;left:0}
.lab-bullet .obj{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--texto)}
.lab-bullet .objpct{text-align:right;font-size:12.5px;color:var(--texto-3);
                    font-variant-numeric:tabular-nums;white-space:nowrap}
.lab-bullet .monto{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

.lab-ruedas{display:grid;grid-template-columns:78px 1fr 66px;gap:4px 10px;align-items:center}
.lab-ruedas .tk{font-size:12px;text-align:right;color:var(--texto-2)}
.lab-ruedas .dias{display:grid;gap:2px;height:22px}
.lab-ruedas .dias i{border-radius:2px;cursor:default}
.lab-ruedas .acum{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.lab-ruedas .eje{display:grid;gap:2px;font-size:10px;color:var(--texto-3);margin-top:4px}
.lab-escala{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:11px;color:var(--texto-3)}
.lab-escala i{width:15px;height:12px;border-radius:2px}

/* Simulación: la barra que prueba compras y ventas sobre la cartera sin
   guardarlas. Va marcada al borde para que nadie la lea como cartera real. */
.lab-sim{border-color:var(--destaque);background:var(--destaque-suave);
         box-shadow:inset 3px 0 0 var(--destaque)}
.lab-marca{background:transparent;font-family:inherit;cursor:pointer;align-self:center;
           margin:0 0 6px 12px}
.lab-marca:hover{background:var(--panel-2)}
.lab-sim .chip{min-width:0;gap:7px;padding-left:10px;padding-right:8px}
.lab-x{border:0;background:transparent;color:inherit;font:inherit;font-size:15px;line-height:1;
       cursor:pointer;opacity:.55;padding:0}
.lab-x:hover{opacity:1}

.lab-pasos{background:var(--panel);border:1px solid var(--borde);border-radius:10px;
           padding:18px 20px 14px;margin-bottom:14px}
.lab-pasos .via{height:2px;background:var(--panel-2);position:relative;margin:0 7px}
.lab-pasos .hecho{position:absolute;left:0;top:0;height:100%;background:var(--acento);
                  box-shadow:0 0 8px var(--acento);transition:width .4s}
.lab-pasos .nodos{position:absolute;inset:0;display:flex;justify-content:space-between;
                  align-items:center}
.lab-pasos .n{width:11px;height:11px;border-radius:50%;background:var(--panel-2);
              border:2px solid var(--borde);transition:.35s}
.lab-pasos .n.on{background:var(--acento);border-color:var(--acento-2);
                 box-shadow:0 0 10px var(--acento)}
.lab-pasos .n.mal{background:var(--negativo);border-color:var(--negativo)}
.lab-pasos .pies{display:flex;justify-content:space-between;gap:14px;margin-top:14px;
                 font-size:12px;color:var(--texto-3)}
.lab-pasos .pies b{color:var(--texto-2)}

/* El cuarto spinner de FDB-05 acompaña a cada "Calculando…". En yema, como el
   resto de lo que pide atención. El anillo de 1px es lo que lo salva en el tema
   claro: la yema sola contra el panel da 1,45:1 y una forma de 24 px con ese
   contraste se lava; el borde ámbar le pone el contorno que la mancha no tiene. */
.cargando{display:flex;flex-direction:column;align-items:center;gap:15px}
.cargando::before{content:"";width:24px;height:24px;background:var(--destaque);
  animation:morph 1.8s ease-in-out infinite;
  box-shadow:0 0 0 1px var(--alerta), 0 0 14px -3px var(--destaque)}
@keyframes morph{0%,100%{border-radius:50%;transform:rotate(0)}
                 50%{border-radius:12% 50% 12% 50%;transform:rotate(180deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── Bienvenida (sin sesión) ───────────────────────────────────────────────
   Es la única pantalla que no sigue el tema: se pinta siempre oscura, con
   valores literales en vez de los tokens de arriba. Alguien con el tema claro
   igual la ve como fue diseñada.

   El carrusel es scroll-snap nativo: el navegador hace el arrastre, la inercia,
   el táctil y las flechas del teclado. El JS del componente sólo agrega en qué
   slide estamos, el autoplay y su barra. */
.bv {
  --bv-acento: #4FC3A8;
  --bv-acento2: #6FD9BE;
  --bv-borde: rgba(255,255,255,.10);
  --bv-slide: min(880px, 88vw);
  --bv-alto: clamp(300px, 54vh, 560px);
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 28px;
  padding: 34px 0 26px;
  background: #16212A;
  color: #E6EDF2;
  overflow-x: hidden;
}
.bv > header, .bv > .bv-carrusel, .bv > footer { position: relative; z-index: 1 }

/* Dos manchas difuminadas que derivan muy despacio, en ciclos de distinta
   duración para que no se las vea volver juntas al mismo lugar. Sólo transform
   y opacity: no repintan nada. */
.bv-luz { position: absolute; z-index: 0; border-radius: 50%; filter: blur(90px);
          pointer-events: none; will-change: transform, opacity }
.bv-luz.a { width: 52vw; height: 52vw; left: -10vw; top: -18vw; background: #1B4C5E;
            opacity: .55; animation: bv-deriva-a 34s ease-in-out infinite alternate }
.bv-luz.b { width: 44vw; height: 44vw; right: -12vw; top: -8vw; background: #12503E;
            opacity: .5; animation: bv-deriva-b 47s ease-in-out infinite alternate }
@keyframes bv-deriva-a { to { transform: translate3d(10vw,9vh,0) scale(1.18); opacity: .38 } }
@keyframes bv-deriva-b { to { transform: translate3d(-12vw,13vh,0) scale(1.12); opacity: .62 } }

/* El pie de la app trae borde y márgenes propios; acá no van. */
.bv > header, .bv > footer { text-align: center; margin: 0; padding: 0 22px;
                             border: 0; max-width: none; display: block }
.bv h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.02em; font-weight: 700 }
.bv h1 span { color: var(--bv-acento) }
.bv header p { margin: 8px 0 0; color: #A6B4BF }

.bv-entrar {
  display: inline-flex; align-items: center; gap: 11px;
  padding: 11px 28px 11px 13px; border-radius: 999px;
  font-weight: 600; font-size: 15px; color: #071018; text-decoration: none;
  background: linear-gradient(120deg, var(--bv-acento), var(--bv-acento2));
  box-shadow: 0 10px 30px -10px rgba(79,195,168,.75);
  transition: transform .18s, box-shadow .18s;
}
.bv-entrar:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -12px rgba(79,195,168,.95) }
.bv-entrar:active { transform: translateY(0) }
/* El logo de Google va sobre blanco: su marca no se apoya sobre un color. */
.bv-g { width: 26px; height: 26px; display: grid; place-items: center;
        background: #fff; border-radius: 50%; flex: none }

.bv-carrusel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px }
/* El padding lateral es el que deja asomar el slide vecino; sin él, el snap
   centrado no tiene de dónde centrar. */
.bv-pista {
  display: flex; gap: 26px; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scroll-behavior: smooth;
  padding: 4px calc((100vw - var(--bv-slide)) / 2); scrollbar-width: none;
}
.bv-pista::-webkit-scrollbar { display: none }
.bv-pista:focus-visible { outline: 2px solid var(--bv-acento2); outline-offset: -4px; border-radius: 22px }
.bv-slide { flex: 0 0 var(--bv-slide); scroll-snap-align: center }

.bv-card {
  position: relative; height: var(--bv-alto); border-radius: 20px; overflow: hidden;
  border: 1px solid var(--bv-borde);
  background: linear-gradient(135deg, #101820, #0D2A26);
  display: flex; flex-direction: column; justify-content: flex-end;
  box-shadow: 0 18px 50px -22px rgba(0,0,0,.9);
  transition: transform .4s, border-color .4s, box-shadow .4s;
}
/* El glow sólo en la que se está mirando: si brillan todas, no destaca ninguna. */
.bv-slide.on .bv-card { box-shadow: 0 0 0 1px rgba(79,195,168,.28),
                                    0 0 70px -14px rgba(79,195,168,.45),
                                    0 24px 60px -26px rgba(0,0,0,.95) }
.bv-slide:not(.on) .bv-card { transform: scale(.94); border-color: transparent; cursor: pointer }
.bv-slide:not(.on) .bv-card:hover { transform: scale(.97); border-color: var(--bv-borde);
    box-shadow: 0 0 50px -18px rgba(79,195,168,.35), 0 18px 50px -22px rgba(0,0,0,.9) }

/* La captura ocupa la tarjeta entera; el degradado de abajo es lo que hace
   legible el texto encima sin recortar la imagen. */
.bv-card img { position: absolute; inset: 0; width: 100%; height: 100%;
               object-fit: cover; object-position: top center; opacity: .68 }
.bv-card::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(5,8,16,.96) 12%, rgba(5,8,16,.55) 48%, transparent 78%) }

.bv-texto { position: relative; z-index: 1; padding: 26px 30px 30px }
.bv-kicker { margin: 0 0 6px; font-size: 12px; letter-spacing: .14em;
             text-transform: uppercase; color: var(--bv-acento) }
.bv-titulo { margin: 0; font-size: clamp(21px, 2.6vw, 29px); letter-spacing: -.015em; font-weight: 700 }
.bv-bajada { margin: 10px 0 0; max-width: 58ch; color: #C5CFDD }

/* Entrada escalonada, sólo en el slide visible. */
.bv-kicker, .bv-titulo, .bv-bajada { opacity: 0; transform: translateY(14px);
                                     transition: opacity .5s, transform .5s }
.on .bv-kicker { opacity: 1; transform: none; transition-delay: .05s }
.on .bv-titulo { opacity: 1; transform: none; transition-delay: .13s }
.on .bv-bajada { opacity: 1; transform: none; transition-delay: .21s }

.bv-controles { display: flex; align-items: center; justify-content: center; gap: 18px }
.bv-flecha { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
             border: 1px solid var(--bv-borde); background: rgba(255,255,255,.06);
             color: #E6EDF2; font-size: 17px; cursor: pointer;
             transition: background .2s, border-color .2s }
.bv-flecha:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.28) }
.bv-puntos { display: flex; gap: 9px }
.bv-punto { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%;
            background: rgba(255,255,255,.22); cursor: pointer;
            transition: background .25s, width .25s }
.bv-punto[aria-current="true"] { width: 26px; border-radius: 999px; background: var(--bv-acento) }
.bv-progreso { width: min(340px, 60vw); height: 2px; margin: 0 auto; border-radius: 2px;
               background: rgba(255,255,255,.10); overflow: hidden }
